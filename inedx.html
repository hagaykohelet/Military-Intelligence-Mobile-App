<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <nav>
        <div class="nav-left"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
                <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
            </svg></div>
        <div class="nav-middle">
            <p>SIGINT OPS</p>
        </div>
        <div class="nav-right">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-dot-icon lucide-dot">
                <circle cx="12.1" cy="12.1" r="1" />
            </svg>
            <strong>SECURE</strong>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-dot-icon lucide-dot">
                <circle cx="12.1" cy="12.1" r="1" />
            </svg>

            <strong>ONLINE</strong>

        </div>
    </nav>
    <main>
        <div class="top-main">
            <div class='radar'>
                <div class='sweep'></div>
            </div>
            <div class="text-numbers">
                <strong class="numbers">24</strong>
                <p class="text">ACTIVE SIGNALS</p>
                <strong class="numbers">07</strong>
                <p class="text">PRIORITY ALERTS</p>
            </div>
        </div>
        <div class="center-button">
            <div class="brief">
                <a href=""><svg class="icon" xmlns="http://www.w3.org/2000/svg" width="15" height="15"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" class="lucide lucide-zap-icon lucide-zap">
                        <path
                            d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z" />
                    </svg>New Brief</a>
            </div>
            <div class="decode">

                <a href=""><svg class="icon" xmlns="http://www.w3.org/2000/svg" width="15" height="15"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" class="lucide lucide-code-icon lucide-code">
                        <path d="m16 18 6-6-6-6" />
                        <path d="m8 6-6 6 6 6" />
                    </svg>Decode</a>
            </div>
            <div class="drone">

                <a href=""><svg class="icon" xmlns="http://www.w3.org/2000/svg" width="15" height="15"
                        viewBox="0 0 24 24">
                        <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                            stroke-miterlimit="10" stroke-width="1.5"
                            d="M15.296 6.291c2.46-2.46 3.866-3.266 4.766-2.366s.101 2.315-2.358 4.774l-1.2 1.2l1.614 7.208c.085.516-.165.972-.532 1.313l-1.414 1.414l-2.766-6.472a.4.4 0 0 0-.632-.143l-3.576 3.146l.727 2.633c.058.243-.036.517-.22.701l-1.298.855l-1.657-3.317l-3.31-1.65l.855-1.297c.185-.184.46-.278.701-.22l2.634.727l3.146-3.576a.4.4 0 0 0-.143-.632L4.16 7.823l1.414-1.415c.34-.366.797-.617 1.312-.532l7.21 1.614z" />
                    </svg>Request Drone</a>
            </div>
        </div>
        <div class="cards">
            <div class="card a">
                <div class="top-card">
                    <div class="right">
                        <p>In Progress</p>
                    </div>
                    <div class="left">
                        CRITICAL
                    </div>
                </div>
                <p>Operation Nightfall</p>
                <div class="bottom-card">
                    <div class="line">

                    </div>
                    <p>65%</p>
                </div>
            </div>
            <div class="card b">
                <div class="top-card">
                    <div class="right">
                        Analyzing
                    </div>
                    <div class="left">
                        HIGH
                    </div>
                </div>
                <p>Signal Intercept Alpha</p>
                <div class="bottom-card">
                    <div class="line">

                    </div>
                    <p>40%</p>
                </div>
            </div>
            <div class="card c">
                <div class="top-card">
                    <div class="right">
                        Pending
                    </div>
                    <div class="left">
                        MEDIUM
                    </div>
                </div>
                <p>Asset Recovery</p>
                <div class="bottom-card">
                    <div class="line">

                    </div>
                    <p>15%</p>
                </div>
            </div>
            <div class="card a">
                <div class="top-card">
                    <div class="right">
                        Active
                    </div>
                    <div class="left">
                        HIGH
                    </div>
                </div>
                <p>Cyber Defense Grid</p>
                <div class="bottom-card">
                    <div class="line">

                    </div>
                    <p>80%</p>
                </div>
            </div>

        </div>
    </main>
</body>

</html>
